services:
  - type: web
    name: ecosistema-nexus-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-postgres-db
          property: connectionString

databases:
  - name: nexus-postgres-db
    databaseName: ecosistema_nexus
    user: nexus_admin
