services:
  - type: web
    name: ecosistema-nexus-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Producción: desactiva DEBUG -> activa HSTS, redirección HTTPS y cookies seguras.
      - key: DEBUG
        value: "False"
      # Render genera y guarda una SECRET_KEY segura (NUNCA queda en el repo).
      - key: SECRET_KEY
        generateValue: true
      # DATABASE_URL se define en el dashboard (Environment) con las credenciales
      # rotadas. NUNCA se pone aquí para no exponerla en el repositorio.
